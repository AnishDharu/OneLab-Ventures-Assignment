services:
  - type: web
    name: pay-recon
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /health
